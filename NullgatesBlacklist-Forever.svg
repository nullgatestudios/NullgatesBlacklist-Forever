<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Blacklist - Forever: a chat bubble struck through (ignore), with a warning badge (warn) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a46"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#a8121c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#c9860a"/>
    </linearGradient>
    <radialGradient id="ominous" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4252f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6a0f14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="240" cy="250" r="190" fill="url(#ominous)"/>

  <!-- chat bubble -->
  <ellipse cx="236" cy="430" rx="120" ry="12" fill="#000000" opacity="0.4"/>
  <path d="M110 120 H362 Q392 120 392 150 V290 Q392 320 362 320 H220 L150 386 L164 320 H110 Q80 320 80 290 V150 Q80 120 110 120 Z" fill="#c4252f" opacity="0.25" filter="url(#glow)"/>
  <path d="M110 120 H362 Q392 120 392 150 V290 Q392 320 362 320 H220 L150 386 L164 320 H110 Q80 320 80 290 V150 Q80 120 110 120 Z" fill="url(#bubble)" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
  <!-- chat lines -->
  <path d="M126 180 H346 M126 222 H316 M126 264 H280" stroke="#8a8a9a" stroke-width="16" stroke-linecap="round"/>
  <!-- strike -->
  <path d="M104 344 L370 98" stroke="#ff4a4a" stroke-width="40" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <path d="M104 344 L370 98" stroke="url(#red)" stroke-width="28" stroke-linecap="round"/>

  <!-- warning badge -->
  <path d="M378 268 L452 398 H304 Z" fill="#e0a526" opacity="0.35" filter="url(#glow)"/>
  <path d="M378 268 L452 398 H304 Z" fill="url(#amber)" stroke="#5e3a06" stroke-width="7" stroke-linejoin="round"/>
  <path d="M378 312 V352" stroke="#2a1a04" stroke-width="14" stroke-linecap="round"/>
  <circle cx="378" cy="376" r="8" fill="#2a1a04"/>
</svg>
