<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Reserve logo for Nullgate's Blacklist - Forever: a pinned "wanted" poster with a player silhouette and a red X stamp -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3b8"/>
      <stop offset="1" stop-color="#c9ab6e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#a8121c"/>
    </linearGradient>
    <radialGradient id="ominous" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4252f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6a0f14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="262" r="190" fill="url(#ominous)"/>

  <!-- poster, slightly tilted -->
  <g transform="rotate(-4 256 260)">
    <ellipse cx="256" cy="438" rx="120" ry="12" fill="#000000" opacity="0.4"/>
    <path d="M128 86 H384 V420 L360 410 L336 420 L312 410 L288 420 L264 410 L240 420 L216 410 L192 420 L168 410 L144 420 L128 412 Z" fill="url(#paper)" stroke="#6e5226" stroke-width="5" stroke-linejoin="round"/>
    <!-- header bar and text lines -->
    <rect x="156" y="112" width="200" height="30" rx="4" fill="#3a2a14"/>
    <path d="M176 127 H336" stroke="#c9a54e" stroke-width="8" stroke-linecap="round" stroke-dasharray="22 10"/>
    <!-- portrait frame -->
    <rect x="176" y="160" width="160" height="156" rx="6" fill="#d8c08a" stroke="#6e5226" stroke-width="4"/>
    <circle cx="256" cy="218" r="32" fill="#4a3a26"/>
    <path d="M196 312 C196 270 222 252 256 252 C290 252 316 270 316 312 Z" fill="#4a3a26"/>
    <!-- lines under portrait -->
    <path d="M170 344 H342 M190 372 H322" stroke="#6e5226" stroke-width="8" stroke-linecap="round"/>
    <!-- nails -->
    <circle cx="150" cy="104" r="9" fill="url(#gold)" stroke="#5e4614" stroke-width="3"/>
    <circle cx="362" cy="104" r="9" fill="url(#gold)" stroke="#5e4614" stroke-width="3"/>
    <!-- small red X at the bottom right of the portrait -->
    <path d="M286 266 L326 306 M326 266 L286 306" stroke="#ff4a4a" stroke-width="22" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
    <path d="M290 270 L322 302 M322 270 L290 302" stroke="url(#red)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- ignore / warn / notice dots -->
  <circle cx="408" cy="416" r="9" fill="#c4252f" stroke="#f0d27a" stroke-width="3"/>
  <circle cx="432" cy="394" r="7" fill="#e0a526" stroke="#f0d27a" stroke-width="3"/>
  <circle cx="440" cy="366" r="6" fill="#2f7fd6" stroke="#f0d27a" stroke-width="3"/>
</svg>
